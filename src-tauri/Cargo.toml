[package]
name = "comfuzio-player"
version = "0.2.1"
description = "Comfuzio Streamer's Media Player"
authors = ["Comfuzio"]
license-file = "../LICENSE"
repository = "https://github.com/comfuzio/Comfuzio-s-Streamer-s-Media-Player"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "comfuzio_player_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# async + serialization
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# persistence
rusqlite = { version = "0.37", features = ["bundled"] }

# networking / resolvers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }

# audio
cpal = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "mkv", "wav", "pcm", "alac"] }
rubato = "0.16"
ringbuf = "0.4"
lofty = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
